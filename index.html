<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VitaLogs" />
    <meta name="theme-color" content="#EFF7FF" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>VitaLogs</title>
    <script src="/theme-init.js"></script>
    <!-- Pantalla de carga: CSS en línea para que se pinte antes de que llegue el paquete de la app. -->
    <style>
      html { background: #eff7ff; }
      html.dark { background: #061820; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #eff7ff;
        transition: opacity 1s ease;
      }
      html.dark #boot { background: #061820; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot img { width: 84px; height: 84px; border-radius: 24px; }
      #boot i {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(10, 94, 128, 0.18);
        border-top-color: #0a5e80;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      html.dark #boot i { border-color: rgba(47, 191, 158, 0.2); border-top-color: #2fbf9e; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Cargando VitaLogs">
      <img src="/icons/logo-mark.svg" alt="" />
      <i></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
