    <!-- Pantalla de carga, siempre oscura: CSS en línea para que se pinte antes de que llegue el paquete de la app. -->
    <style>
      html, body { background: #061820; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 80px;
        background: radial-gradient(circle at 50% 44%, rgba(47, 191, 158, 0.16), rgba(47, 191, 158, 0) 360px) #061820;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 1s ease;
      }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot img { width: 88px; height: 88px; border-radius: 26px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); }
      #boot b { margin-top: 22px; font-size: 34px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #e6f3f7; }
      #boot b span { color: #2fbf9e; }
      #boot p { margin: 24px 0 14px; font-size: 15px; font-weight: 600; color: #8daeb9; }
      #boot i { position: relative; width: 120px; height: 4px; border-radius: 4px; background: #1a3f4d; overflow: hidden; }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 4px;
        background: #2fbf9e;
        animation: boot-load 1.1s ease-in-out infinite;
      }
      @keyframes boot-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>

    <div id="boot" role="status" aria-label="Cargando VitaLogs">

      <b>Vita<span>Logs</span></b>
      <p>Cargando…</p>
      <i></i>
    </div>
